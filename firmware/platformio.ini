[env:deneyapkart1Av2]
platform = espressif32
board = deneyapkart1Av2
framework = arduino

monitor_speed = 115200

build_flags =
    -I include
    -DNFC_INTERFACE_HSU

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    madhephaestus/ESP32Servo
    https://github.com/Seeed-Studio/PN532.git
